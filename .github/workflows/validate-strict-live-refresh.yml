name: Validate strict live refresh fix

on:
  pull_request:
    paths:
      - "worldcup_predictor/odds/**"
      - "worldcup_predictor/owner_daily/**"
      - "worldcup_predictor/research/ecse_live/**"
      - "scripts/validate_strict_live_odds_refresh_fix.py"
      - ".github/workflows/validate-strict-live-refresh.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -q "pydantic>=2.0" "pydantic-settings>=2.0"
      - name: Compile changed Python areas
        run: |
          python -m compileall -q \
            worldcup_predictor/odds \
            worldcup_predictor/owner_daily \
            worldcup_predictor/research/ecse_live \
            scripts/validate_strict_live_odds_refresh_fix.py
      - name: Validate strict refresh behavior
        shell: bash
        run: |
          set +e
          python scripts/validate_strict_live_odds_refresh_fix.py 2>&1 | tee validator-output.txt
          code=${PIPESTATUS[0]}
          echo "validator_exit_code=${code}" >> "$GITHUB_ENV"
          exit "$code"
      - name: Upload validator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-refresh-validator-output
          path: validator-output.txt
          if-no-files-found: warn
