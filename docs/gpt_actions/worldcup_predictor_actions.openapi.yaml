openapi: 3.1.0
info:
  title: WorldCup Predictor GPT Actions
  version: 1.1.1
  description: |
    Owner-only narrow REST bridge for ChatGPT Plus Custom GPT Actions.
    Returns structured model evidence (WDE, BTTS, O/U 2.5, ECSE Top1–Top5).
    Long predictions use async jobs — poll until completed.
    Tier A fixtures: display_status=TRUSTED. Tier B: TEST PHASE — UNDER FORWARD EVALUATION.
    listTodayMatches performs broad provider+DB fixture discovery with classification (not prediction-gated).
servers:
  - url: https://footballpredictor.it.com
    description: Production HTTPS (443)
security:
  - ApiKeyAuth: []
paths:
  /api/gpt-actions/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: Get bridge and canonical pipeline health
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/gpt-actions/v1/matches/discover:
    get:
      operationId: discoverTodayMatches
      summary: Discover fixtures for a calendar date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: timezone
          in: query
          required: false
          schema:
            type: string
            default: Europe/Vienna
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [production, owner, shadow, trusted, test_phase]
            default: production
          description: production/trusted=Tier A; owner=Tier A+B; shadow/test_phase=Tier B only
      responses:
        "200":
          description: Discovered matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverMatchesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/gpt-actions/v1/matches/list:
    get:
      operationId: listTodayMatches
      summary: Broad fixture listing with classification (not prediction-gated)
      description: |
        Returns all discoverable fixtures for a date with listing_status classification.
        Listing does not imply prediction eligibility. Use discoverTodayMatches for prediction discovery.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: timezone
          in: query
          required: false
          schema:
            type: string
            default: Europe/Vienna
        - name: listing_filter
          in: query
          required: false
          schema:
            type: string
            enum: [all, trusted, test_phase, prediction_eligible]
            default: all
          description: trusted=Tier A only; test_phase=Tier B only; prediction_eligible=gated subset
      responses:
        "200":
          description: Broad classified match list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMatchesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/gpt-actions/v1/matches/filter-odds:
    post:
      operationId: filterMatchesByOdds
      summary: Filter discovered matches by decimal odds thresholds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilterMatchesRequest"
      responses:
        "200":
          description: Filtered matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterMatchesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/gpt-actions/v1/prediction-jobs:
    post:
      operationId: startPredictionJob
      summary: Start async canonical prediction job
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPredictionJobRequest"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/gpt-actions/v1/prediction-jobs/{job_id}:
    get:
      operationId: getPredictionJob
      summary: Poll prediction job status and evidence
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/gpt-actions/v1/reports/latest:
    get:
      operationId: getLatestPredictionReport
      summary: Fetch latest owner markdown report
      responses:
        "200":
          description: Latest report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/gpt-actions/v1/reports/{report_date}:
    get:
      operationId: getPredictionReportByDate
      summary: Fetch owner report for YYYY-MM-DD
      parameters:
        - name: report_date
          in: path
          required: true
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Report for date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
  responses:
    Unauthorized:
      description: Missing or invalid API key
    BadRequest:
      description: Invalid input
    NotFound:
      description: Resource not found
    RateLimited:
      description: Rate limit or job concurrency exceeded
  schemas:
    OddsFilter:
      type: object
      additionalProperties: false
      properties:
        home_odds_gt:
          type: number
          minimum: 1
          maximum: 100
        away_odds_gt:
          type: number
          minimum: 1
          maximum: 100
    FilterMatchesRequest:
      type: object
      required: [date]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        timezone:
          type: string
          default: Europe/Vienna
        scope:
          type: string
          enum: [production, owner, shadow]
          default: production
        filter:
          $ref: "#/components/schemas/OddsFilter"
    StartPredictionJobRequest:
      type: object
      required: [date]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        timezone:
          type: string
          default: Europe/Vienna
        scope:
          type: string
          enum: [production, owner, shadow]
          default: production
        prediction_scope:
          type: string
          enum: [production, owner_shadow, owner]
          default: production
        filter:
          $ref: "#/components/schemas/OddsFilter"
        fixture_ids:
          type: array
          maxItems: 20
          items:
            type: integer
            minimum: 1
        select_best:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        include_all_predictions:
          type: boolean
          default: true
        exact_score_top_n:
          type: integer
          minimum: 1
          maximum: 5
          default: 5
        refresh_if_stale:
          type: boolean
          default: true
    JobCreateResponse:
      type: object
      required: [job_id, status, created_at, poll_after_seconds]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running]
        created_at:
          type: string
        poll_after_seconds:
          type: integer
          minimum: 1
          maximum: 30
    JobStatusResponse:
      type: object
      required: [job_id, status, created_at, updated_at]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, partial, failed]
        created_at:
          type: string
        updated_at:
          type: string
        result:
          $ref: "#/components/schemas/PredictionJobResult"
        error:
          type: string
    PredictionJobResult:
      type: object
      properties:
        date:
          type: string
        timezone:
          type: string
        fixture_count:
          type: integer
        fixture_ids:
          type: array
          maxItems: 20
          items:
            type: integer
        predictions:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/FixtureEvidence"
        all_match_ranking:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/MatchRankingRow"
        best_3:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/FixtureEvidence"
        contains_test_phase_fixture:
          type: boolean
          nullable: true
        test_phase_warning:
          type: string
          nullable: true
        truncated:
          type: boolean
    OddsEvidence:
      type: object
      properties:
        home:
          type: number
          nullable: true
        draw:
          type: number
          nullable: true
        away:
          type: number
          nullable: true
        bookmaker_count:
          type: integer
          nullable: true
        provider:
          type: string
          nullable: true
        freshness:
          type: string
          nullable: true
        age_minutes:
          type: number
          nullable: true
    WdeEvidence:
      type: object
      properties:
        home_probability:
          type: number
          nullable: true
        draw_probability:
          type: number
          nullable: true
        away_probability:
          type: number
          nullable: true
        prediction:
          type: string
          nullable: true
          description: Canonical WDE decision pick (same as decision_pick)
        decision_pick:
          type: string
          nullable: true
          description: Canonical WDE decision layer pick
        effective_pick:
          type: string
          nullable: true
        probability_argmax:
          type: string
          nullable: true
          description: FT marginal direction from H/D/A probability argmax
        decision_source:
          type: string
          nullable: true
        raw_pick:
          type: string
          nullable: true
        confidence:
          type: number
          nullable: true
        wde_execution_status:
          type: string
          nullable: true
          enum: [executed, skipped, generated, none]
        wde_result_source:
          type: string
          nullable: true
          enum: [fresh_engine, stored_prediction, none]
        wde_warning:
          type: string
          nullable: true
    BttsEvidence:
      type: object
      properties:
        prediction:
          type: string
          nullable: true
        yes_probability:
          type: number
          nullable: true
        no_probability:
          type: number
          nullable: true
    OverUnder25Evidence:
      type: object
      properties:
        prediction:
          type: string
          nullable: true
        over_probability:
          type: number
          nullable: true
        under_probability:
          type: number
          nullable: true
    EcseScore:
      type: object
      properties:
        rank:
          type: integer
          nullable: true
        score:
          type: string
          nullable: true
        probability:
          type: number
          nullable: true
    EcseEvidence:
      type: object
      properties:
        top1:
          $ref: "#/components/schemas/EcseScore"
        top2:
          $ref: "#/components/schemas/EcseScore"
        top3:
          $ref: "#/components/schemas/EcseScore"
        top4:
          $ref: "#/components/schemas/EcseScore"
        top5:
          $ref: "#/components/schemas/EcseScore"
        top3_mass:
          type: number
          nullable: true
        top5_mass:
          type: number
          nullable: true
    FixtureEvidence:
      type: object
      properties:
        match:
          type: string
        fixture_id:
          type: integer
          nullable: true
        competition:
          type: string
          nullable: true
        kickoff:
          type: string
          nullable: true
        timezone:
          type: string
        validation_tier:
          type: string
          enum: [A, B]
          nullable: true
        display_status:
          type: string
          enum: [TRUSTED, TEST_PHASE]
          nullable: true
        display_label:
          type: string
          nullable: true
        validation_note:
          type: string
          nullable: true
        owner_shadow:
          type: boolean
          nullable: true
        odds:
          $ref: "#/components/schemas/OddsEvidence"
        provider:
          type: string
          nullable: true
        freshness:
          type: string
          nullable: true
        wde:
          $ref: "#/components/schemas/WdeEvidence"
        btts:
          $ref: "#/components/schemas/BttsEvidence"
        over_under_2_5:
          $ref: "#/components/schemas/OverUnder25Evidence"
        ecse:
          $ref: "#/components/schemas/EcseEvidence"
        consensus:
          type: string
          nullable: true
        quality:
          type: string
          enum: [OK, PARTIAL, FAILED, BLOCKED]
          nullable: true
        warnings:
          type: array
          maxItems: 20
          items:
            type: string
    MatchRankingRow:
      type: object
      properties:
        fixture_id:
          type: integer
          nullable: true
        match:
          type: string
          nullable: true
        wde_confidence:
          type: number
          nullable: true
        wde_pick:
          type: string
          nullable: true
        ecse_top1:
          $ref: "#/components/schemas/EcseScore"
    DiscoveredMatch:
      allOf:
        - $ref: "#/components/schemas/FixtureTierMetadata"
        - type: object
          properties:
            fixture_id:
              type: integer
            home_team:
              type: string
            away_team:
              type: string
            kickoff_utc:
              type: string
            competition:
              type: string
            status:
              type: string
            tier:
              type: string
              nullable: true
    ListMatchesResponse:
      type: object
      properties:
        date:
          type: string
        timezone:
          type: string
        mode:
          type: string
          enum: [broad_listing]
        listing_filter:
          type: string
        count:
          type: integer
        tier_a_count:
          type: integer
        tier_b_count:
          type: integer
        unsupported_count:
          type: integer
        friendly_count:
          type: integer
        prediction_candidate_count:
          type: integer
        audit:
          type: object
          additionalProperties: true
          description: Broad discovery audit (provider raw count, dedupe, source order)
        matches:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/DiscoveredMatch"
    FilteredMatch:
      type: object
      properties:
        fixture_id:
          type: integer
        home_team:
          type: string
        away_team:
          type: string
        kickoff_utc:
          type: string
        competition:
          type: string
        status:
          type: string
        odds:
          $ref: "#/components/schemas/OddsEvidence"
    DiscoverMatchesResponse:
      type: object
      properties:
        date:
          type: string
        timezone:
          type: string
        scope:
          type: string
        count:
          type: integer
        tier_a_count:
          type: integer
        tier_b_count:
          type: integer
        matches:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/DiscoveredMatch"
    FilterMatchesResponse:
      type: object
      properties:
        date:
          type: string
        timezone:
          type: string
        filter:
          $ref: "#/components/schemas/OddsFilter"
        count:
          type: integer
        matches:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/FilteredMatch"
    ApplicationHealth:
      type: object
      properties:
        status:
          type: string
        http_status:
          type: integer
          nullable: true
    CpuSnapshot:
      type: object
      properties:
        load_1m:
          type: number
          nullable: true
        load_5m:
          type: number
          nullable: true
        load_15m:
          type: number
          nullable: true
    MemorySnapshot:
      type: object
      properties:
        total_bytes:
          type: integer
          nullable: true
        available_bytes:
          type: integer
          nullable: true
        percent_used:
          type: number
          nullable: true
        meminfo:
          $ref: "#/components/schemas/MeminfoSnapshot"
    MeminfoSnapshot:
      type: object
      properties:
        MemTotal:
          type: string
          nullable: true
        MemFree:
          type: string
          nullable: true
        MemAvailable:
          type: string
          nullable: true
        Buffers:
          type: string
          nullable: true
        Cached:
          type: string
          nullable: true
    DiskSnapshot:
      type: object
      properties:
        total_bytes:
          type: integer
        used_bytes:
          type: integer
        free_bytes:
          type: integer
    DatabaseSnapshot:
      type: object
      properties:
        exists:
          type: boolean
        size_bytes:
          type: integer
    HealthPayload:
      type: object
      properties:
        timestamp_utc:
          type: string
        hostname:
          type: string
        service_worldcup_api:
          type: string
        application_health:
          $ref: "#/components/schemas/ApplicationHealth"
        cpu:
          $ref: "#/components/schemas/CpuSnapshot"
        memory:
          $ref: "#/components/schemas/MemorySnapshot"
        disk:
          $ref: "#/components/schemas/DiskSnapshot"
        database:
          $ref: "#/components/schemas/DatabaseSnapshot"
        current_git_sha:
          type: string
          nullable: true
        git_sha_source:
          type: string
          nullable: true
        mcp_version:
          type: string
    ProviderFlags:
      type: object
      properties:
        api_football_configured:
          type: boolean
          nullable: true
        sportmonks_configured:
          type: boolean
          nullable: true
        oddalerts_configured:
          type: boolean
          nullable: true
    ModelStatusPayload:
      type: object
      properties:
        wde_available:
          type: boolean
        ecse_available:
          type: boolean
        wde_model_version:
          type: string
          nullable: true
        ecse_model_version:
          type: string
          nullable: true
        canonical_pipeline_ready:
          type: boolean
          nullable: true
        db_connectivity:
          type: boolean
        latest_prediction_timestamp:
          type: string
          nullable: true
        odds_freshness_subsystem:
          type: string
        strict_live_refresh:
          type: string
        providers:
          $ref: "#/components/schemas/ProviderFlags"
    SystemStatusResponse:
      type: object
      properties:
        service:
          type: string
        mcp_bridge:
          type: string
        health:
          $ref: "#/components/schemas/HealthPayload"
        model_status:
          $ref: "#/components/schemas/ModelStatusPayload"
        git_sha:
          type: string
          nullable: true
        reports_dir:
          type: string
    ReportResponse:
      type: object
      properties:
        found:
          type: boolean
        report_name:
          type: string
          nullable: true
        report_date:
          type: string
          nullable: true
        content:
          type: string
          maxLength: 95000
        generated_at:
          type: string
          nullable: true
        report_type:
          type: string
          nullable: true
          enum:
            - PREDICTION_DAILY
            - PREDICTION_MATCH
            - PREDICTION_COMBO
            - PREDICTION_OWNER
        source:
          type: string
          nullable: true
