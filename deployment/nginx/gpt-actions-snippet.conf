# Narrow GPT Actions bridge — add INSIDE the existing HTTPS server block for footballpredictor.it.com
# Do NOT deploy automatically. Review and merge manually after Phase 4 approval.
#
# Prerequisites:
#   - worldcup-gpt-actions.service active on 127.0.0.1:8770
#   - /etc/worldcup-gpt-actions/environment with GPT_ACTIONS_API_KEY (outside Git)
#   - limit_req_zone in http {} block (once):
#       limit_req_zone $binary_remote_addr zone=gpt_actions:10m rate=30r/m;

    location = /api/gpt-actions/v1/system/status {
        limit_req zone=gpt_actions burst=10 nodelay;
        proxy_pass http://127.0.0.1:8770/api/gpt-actions/v1/system/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    location /api/gpt-actions/v1/ {
        limit_req zone=gpt_actions burst=10 nodelay;
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    # Explicit deny — MCP must never be proxied publicly
    location /mcp {
        return 404;
    }
